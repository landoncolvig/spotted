[package]
name = "spotted"
version = "0.0.50"
description = "Spot people in your video footage."
authors = ["Landon Colvig <colviglandon@gmail.com>"]
edition = "2021"

[lib]
name = "spotted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# Crash reporting. We use the default panic + backtrace integrations only;
# explicitly disable transports we don't need to keep the dep tree light.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
